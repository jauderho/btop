name: Continuous Build MacOS

permissions:
  contents: read
  id-token: write
  attestations: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags-ignore:
      - '*.*'
    paths:
      - 'src/**'
      - '!src/linux/**'
      - '!src/freebsd/**'
      - '!src/netbsd/**'
      - '!src/openbsd/**'
      - 'include/**'
      - 'Makefile'
      - '.github/workflows/continuous-build-macos.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '!src/linux/**'
      - '!src/freebsd/**'
      - '!src/netbsd/**'
      - '!src/openbsd/**'
      - 'include/**'
      - 'Makefile'
      - '.github/workflows/continuous-build-macos.yml'

jobs:
  build-macos:
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os.runner }}
      cancel-in-progress: true
    continue-on-error: true
    strategy:
      matrix:
        os:
          - runner: macos-14
            version: Sonoma
          - runner: macos-15
            version: Sequoia
          - runner: macos-26
            version: Tahoe
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Homebrew packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ matrix.os.runner }}-brew-${{ hashFiles('.github/workflows/continuous-build-macos.yml') }}
          restore-keys: |
            ${{ matrix.os.runner }}-brew-

      - name: Install build tools
        run: |
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install --force --overwrite llvm lowdown ccache

      - name: Cache compiler objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ matrix.os.runner }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ matrix.os.runner }}-ccache-

      - name: Compile
        env:
          RUNNER: "${{ matrix.os.runner }}"
          VERSION: "${{ matrix.os.version }}"
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 500M
          # Max-perf tuning. Makefile `OPTFLAGS := -O2 $(LTO)` and
          # `WARNFLAGS :=` are plain assignments, so CLI values win; OPTFLAGS
          # feeds both CXXFLAGS and LDFLAGS (compile+link LTO). -mcpu=apple-m2
          # tunes for the M2 target (build-only on M1 runners, never executed
          # there). FAST hardening keeps security-critical libc++ checks.
          BTOP_OPTFLAGS: -O3 -flto=thin
          BTOP_WARNFLAGS: -Wall -Wextra -pedantic -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_FAST
          BTOP_CXXFLAGS: -mcpu=apple-m2 -DNDEBUG -ffunction-sections -fdata-sections -fno-math-errno
          BTOP_LDFLAGS: -Wl,-dead_strip
        run: |
          ccache -z
          make CXX="ccache $(brew --prefix llvm)/bin/clang++" ARCH=arm64 STATIC=true STRIP=true BUILD_TYPE=Release OPTFLAGS="$BTOP_OPTFLAGS" WARNFLAGS="$BTOP_WARNFLAGS" CXXFLAGS="$BTOP_CXXFLAGS" LDFLAGS="$BTOP_LDFLAGS"
          ccache -s
          # STRIP=true passes -s at link time; re-strip to drop any remaining
          # defined symbols. Undefined (U) imports always remain in Mach-O.
          "$(brew --prefix llvm)/bin/llvm-strip" bin/btop
          GIT_HASH=$(git rev-parse --short "$GITHUB_SHA")
          mv bin/btop bin/btop-arm64-${RUNNER}-${VERSION}-$GIT_HASH
          ls -alh bin
          "$(brew --prefix llvm)/bin/llvm-nm" --defined-only bin/btop-arm64-* 2>&1 | head -3 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: btop-arm64-${{ matrix.os.runner }}-${{ matrix.os.version }}
          path: 'bin/*'

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: bin/
          format: spdx-json
          output-file: sbom-${{ matrix.os.runner }}-${{ matrix.os.version }}.spdx.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'bin/btop-arm64-*'

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'bin/btop-arm64-*'
          sbom-path: 'sbom-${{ matrix.os.runner }}-${{ matrix.os.version }}.spdx.json'
