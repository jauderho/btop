name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      # pin gh to this repo: it would otherwise resolve the git remote
      # named "upstream" (aristocratos/btop) added below
      GH_REPO: ${{ github.repository }}
      UPSTREAM: https://github.com/aristocratos/btop.git
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      # credentials are kept for the push below; nothing is uploaded as an artifact
      - name: Check out main  # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream "+refs/heads/main:refs/remotes/upstream/main"
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::warning::merge with upstream/main conflicted; main not updated"
          fi

      - name: Push main
        # GITHUB_TOKEN may not push commits that change .github/workflows/,
        # so this fails when upstream edits its own CI; releases still build
        continue-on-error: true
        run: |
          # main may have moved while this job ran (e.g. PR merges);
          # integrate it so the push is a fast-forward
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:main

      - name: Dispatch builds for unreleased tags (v1.4.5 and above)
        run: |
          MIN=10405  # v1.4.5
          ACTIVE=$(gh run list --workflow macos-release.yml --limit 100 --json displayTitle,status \
            --jq '.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting") | .displayTitle')
          for TAG in $(git ls-remote --tags upstream 'v*' | grep -v '\^{}' | sed 's|.*refs/tags/||' | sort -V); do
            [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || continue
            NUM=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
            (( NUM >= MIN )) || continue
            # only a published release counts; a draft is left by a failed upload
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
              continue
            fi
            if grep -qxF "Build $TAG" <<< "$ACTIVE"; then
              echo "build for $TAG already queued or running"
              continue
            fi
            echo "dispatching build for $TAG"
            gh workflow run macos-release.yml --ref main -f tag="$TAG"
          done
